<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>HDG Plant Master</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: HMI control-room console (ISA-101 spirit: calm greys, colour only for state) — sticky status rail, mode tabs, work area + side rail */
:root{
  --bg:#e2e5e6; --panel:#f4f5f5; --panel2:#eaedee; --ink:#1c2226; --muted:#5a6670; --line:#c4cacd; --line2:#d6dbdd;
  --steel:#33566f; --steel-ink:#ffffff; --zinc:#c96f1d; --zinc-soft:#f6e3cf; --silver:#9aa6ae;
  --ok:#2c7a4b; --ok-bg:#dcefe2; --warn:#9c6510; --warn-bg:#f6ead2; --crit:#b02f2f; --crit-bg:#f6dcdc; --info:#33566f; --info-bg:#dde7ee;
  --iso-top:#d9dee0; --iso-l:#b7bfc4; --iso-r:#c8cfd3; --iso-edge:#7f8b92; --iso-ghost:#9aa5ab;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181b; --panel:#1b2125; --panel2:#20272c; --ink:#dce3e7; --muted:#8e9aa3; --line:#2f383e; --line2:#283036;
  --steel:#6f9cc0; --steel-ink:#0d1418; --zinc:#ec9a4e; --zinc-soft:#3a2a1b; --silver:#7c8890;
  --ok:#5cc48a; --ok-bg:#16301f; --warn:#e0aa4a; --warn-bg:#33280f; --crit:#f07070; --crit-bg:#3a1a1a; --info:#7fb0d4; --info-bg:#172a36;
  --iso-top:#3a444a; --iso-l:#262e33; --iso-r:#2f383e; --iso-edge:#5f6d75; --iso-ghost:#55636b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181b; --panel:#1b2125; --panel2:#20272c; --ink:#dce3e7; --muted:#8e9aa3; --line:#2f383e; --line2:#283036;
  --steel:#6f9cc0; --steel-ink:#0d1418; --zinc:#ec9a4e; --zinc-soft:#3a2a1b; --silver:#7c8890;
  --ok:#5cc48a; --ok-bg:#16301f; --warn:#e0aa4a; --warn-bg:#33280f; --crit:#f07070; --crit-bg:#3a1a1a; --info:#7fb0d4; --info-bg:#172a36;
  --iso-top:#3a444a; --iso-l:#262e33; --iso-r:#2f383e; --iso-edge:#5f6d75; --iso-ghost:#55636b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:600;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.6rem} h3{font-size:1.25rem} h4{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.en{color:var(--muted);font-style:italic;font-size:.88em;font-weight:400}

/* top rail */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-disp);font-size:1.45rem;letter-spacing:.04em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--zinc)}
.brand span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;min-width:76px;padding:3px 9px;border:1px solid var(--line);background:var(--panel2);border-radius:3px}
.chip small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chip span{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.chip.bad span{color:var(--crit)} .chip.hot span{color:var(--zinc)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-top:2px}
.tab{appearance:none;border:1px solid var(--line);border-bottom:none;background:var(--panel2);color:var(--muted);padding:7px 14px;font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;border-radius:4px 4px 0 0;cursor:pointer;white-space:nowrap}
.tab .k{font-family:var(--f-mono);font-size:11px;margin-right:6px;opacity:.7}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);border-color:var(--line);box-shadow:inset 0 3px 0 var(--zinc)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab:focus-visible,.btn:focus-visible,.opt:focus-within,.sub:focus-visible{outline:2px solid var(--zinc);outline-offset:2px}

main{padding-block:18px 60px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.layout.three{grid-template-columns:200px minmax(0,1fr) 360px}

.layout.wide{grid-template-columns:200px minmax(0,1fr)}
@media (max-width:1100px){.layout.three{grid-template-columns:minmax(0,1fr) 340px}.layout.three>.steps{grid-column:1/-1}}
@media (max-width:860px){.layout,.layout.three,.layout.wide{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.sep{height:1px;background:var(--line2);margin:6px 0}

/* buttons & inputs */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 12px;border-radius:3px;font:500 13px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--steel-ink);font-weight:600}
.btn.zinc{background:var(--zinc);border-color:var(--zinc);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{appearance:none;border:1px solid var(--line);background:transparent;color:var(--steel);width:20px;height:20px;border-radius:50%;font:600 11px var(--f-mono);cursor:pointer;padding:0;flex:none;line-height:18px}
.ib:hover{background:var(--info-bg)}
input[type=number],select,input[type=search]{font:13px var(--f-mono);padding:5px 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);max-width:100%}
input[type=number]{width:86px}
input[type=range]{accent-color:var(--zinc);width:100%}
label{cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line2)}
.field:first-child{border-top:none}
.flabel{display:flex;align-items:center;gap:8px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:var(--panel2)}
.opt input{margin-top:3px;accent-color:var(--steel)}
.opt.sel{border-color:var(--steel);background:var(--info-bg)}
.opt .c{margin-left:auto;font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.opt small{display:block;color:var(--muted);font-size:11.5px}
.slider{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.slider output{font:13px var(--f-mono);min-width:72px;text-align:right}

/* state */
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:3px;border-left:4px solid;font-size:13px}
.alert.ok{background:var(--ok-bg);border-color:var(--ok)} .alert.warn{background:var(--warn-bg);border-color:var(--warn)} .alert.crit{background:var(--crit-bg);border-color:var(--crit)} .alert.info{background:var(--info-bg);border-color:var(--info)}
.alert .lv{font:600 11px var(--f-mono);text-transform:uppercase;min-width:42px}
.alert.ok .lv{color:var(--ok)} .alert.warn .lv{color:var(--warn)} .alert.crit .lv{color:var(--crit)} .alert.info .lv{color:var(--info)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font:600 11px var(--f-mono);letter-spacing:.02em}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--panel2);color:var(--muted)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--steel)}
.meter.z i{background:var(--zinc)} .meter.c i{background:var(--crit)} .meter.o i{background:var(--ok)}
.gauge{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);min-width:0}
.gauge small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gauge b{font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.gauge.bad b{color:var(--crit)} .gauge.hot b{color:var(--zinc)} .gauge.good b{color:var(--ok)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* steps list */
.steps{display:flex;flex-direction:column;gap:4px}
.step{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:8px 10px;cursor:pointer;color:var(--ink);display:flex;gap:8px;align-items:baseline;font:14px var(--f-body)}
.step .k{font:12px var(--f-mono);color:var(--muted)}
.step[aria-current="true"]{border-color:var(--zinc);box-shadow:inset 3px 0 0 var(--zinc)}
.step.done .k{color:var(--ok)}
.subnav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.sub{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:3px;font:500 13px var(--f-body);cursor:pointer;display:flex;gap:6px;align-items:center}
.sub[aria-current="true"]{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.sub .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.sub .dot.on{background:var(--zinc)}

/* bath cards */
.bath{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bath header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bath header .sw{width:12px;height:22px;border-radius:2px;border:1px solid var(--line)}
.lab{border:1px dashed var(--line);border-radius:3px;padding:6px 8px;background:var(--panel2);font-size:12.5px}
.lab .r{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono)}
.lab .stale{color:var(--warn);font-size:11px}

.iso{width:100%;height:auto;display:block}
.iso .t{fill:var(--iso-top);stroke:var(--iso-edge);stroke-width:.6}
.iso .l{fill:var(--iso-l);stroke:var(--iso-edge);stroke-width:.6}
.iso .r{fill:var(--iso-r);stroke:var(--iso-edge);stroke-width:.6}
.iso .g{fill:none;stroke:var(--iso-ghost);stroke-width:.8;stroke-dasharray:3 3}
.iso .slab{fill:var(--panel2);stroke:var(--iso-edge);stroke-width:.6}
.iso .frame{stroke:var(--iso-edge);stroke-width:.8;fill:none}
.iso .roof{stroke:var(--iso-ghost);stroke-width:.8;fill:none;stroke-dasharray:4 3}
.iso text{font:600 9px var(--f-body);fill:var(--ink)}
.iso .hit{cursor:pointer}
.iso .hit:hover .t{stroke:var(--zinc);stroke-width:1.4}

.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .gr{stroke:var(--line2);stroke-width:1}
.chart text{font:10px var(--f-mono);fill:var(--muted)}

.log{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.log div{display:grid;grid-template-columns:62px 1fr;gap:6px;padding:3px 0;border-bottom:1px dotted var(--line2)}
.log .tm{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.log .crit{color:var(--crit)} .log .ok{color:var(--ok)} .log .warn{color:var(--warn)}

.mtc{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);background:var(--panel2);padding:10px 12px;border-radius:3px}
.mtc table td,.mtc table th{border-bottom:1px dashed var(--line)}
.phase{display:flex;height:34px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.phase div{display:flex;align-items:center;justify-content:center;font:11px var(--f-mono);color:#1b1b1b;min-width:0;overflow:hidden;white-space:nowrap}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,16,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card.crit{border-top:5px solid var(--crit)} .card.warn{border-top:5px solid var(--warn)} .card.enc{border-top:5px solid var(--steel)}
.formula{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);padding:8px 10px;border-radius:3px;font-size:13px;overflow-x:auto}
.tip{border-left:3px solid var(--zinc);padding:6px 10px;background:var(--zinc-soft);font-size:13px}
#toasts{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel);padding:8px 12px;border-radius:3px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.crit{border-left-color:var(--crit)} .toast.warn{border-left-color:var(--warn)} .toast.ok{border-left-color:var(--ok)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.encgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.encitem{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:9px 11px;cursor:pointer;color:var(--ink);font:13px var(--f-body);display:flex;flex-direction:column;gap:2px}
.encitem:hover{border-color:var(--steel)}
.encitem b{font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){.glow{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{opacity:.75}}}

/* plot plan editor */
.plotwrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel2);margin-top:8px}
.plot{display:block;width:100%;min-width:620px;height:auto;touch-action:none;user-select:none}
.plot .plotbg{stroke:var(--iso-edge);stroke-width:.15}
.plot .pg{fill:none;stroke:var(--line2);stroke-width:.05}
.plot .pg6{fill:none;stroke:var(--line);stroke-width:.1}
.plot .bldg{fill:none;stroke:var(--steel);stroke-width:.25;stroke-dasharray:1 .6}
.plot .pl-note{font:1.2px var(--f-mono);fill:var(--steel)}
.plot .li{cursor:grab}
.plot .li rect{stroke:#3d474d;stroke-width:.12}
.plot .li rect.zone{stroke-dasharray:.5 .3;opacity:.75}
.plot .li.sel rect{stroke:var(--zinc);stroke-width:.35}
.plot .li.bad rect{stroke:var(--crit);stroke-width:.3}
.plot .li.clash rect{fill:var(--crit-bg)!important;stroke:var(--crit)}
.plot .li:focus{outline:none}.plot .li:focus rect{stroke:var(--zinc);stroke-width:.35}
.plot .pl-lb{font:600 1.15px var(--f-body);fill:#1d2328;pointer-events:none}
.plot .route{fill:none;stroke:var(--zinc);stroke-width:.28;stroke-linejoin:round;pointer-events:none;opacity:.9}
.plot .arw{fill:var(--zinc)}
.plot .rn{fill:var(--zinc);pointer-events:none}
.plot .rnt{font:700 .9px var(--f-mono);fill:#fff;pointer-events:none}
.plot .ghost{fill:var(--info-bg);stroke:var(--steel);stroke-width:.2;stroke-dasharray:.5 .3;pointer-events:none}
.plot .ghost.clash{fill:var(--crit-bg);stroke:var(--crit)}
.plot.placing{cursor:crosshair}
.btn .sw{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
/* learning mode */
.coach[hidden]{display:none}
.coach{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));max-height:min(62vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--steel);border-top:4px solid var(--steel);border-radius:5px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.coach-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.coach-h b{font-family:var(--f-disp);font-size:17px;letter-spacing:.02em}
.coach-b{display:flex;flex-direction:column;gap:8px;line-height:1.5}
.coach .task{border:1px dashed var(--warn);border-radius:3px;padding:6px 8px;background:var(--warn-bg)}
.coach .formula{font-size:12px}
.btn.qz{justify-content:flex-start;text-align:left;white-space:normal}
.btn.qok{border-color:var(--ok);background:var(--ok-bg)} .btn.qbad{border-color:var(--crit);background:var(--crit-bg)}
.tut-hl{outline:3px solid var(--zinc)!important;outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.tut-hl{animation:tutp 1.6s ease-in-out infinite}@keyframes tutp{50%{outline-color:transparent}}}
@media (max-width:860px){.coach{max-height:46vh}}

/* Kolay mod */
.seg{display:inline-flex;gap:0}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:3px 0 0 3px}.seg .btn:last-child{border-radius:0 3px 3px 0;margin-left:-1px}
.btn.big{padding:10px 18px;font-size:15px}
.btn.huge{width:100%;justify-content:center;padding:16px;font:700 22px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;margin-top:10px}
.panel.intro h2{font-size:1.9rem}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qcard{appearance:none;text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font:13px var(--f-body);transition:border-color .15s,transform .15s}
.qcard b{font:600 18px var(--f-disp);letter-spacing:.02em}
.qcard span{color:var(--muted)}
.qcard:hover{border-color:var(--steel)}
.qcard.on{border-color:var(--zinc);background:var(--zinc-soft)}
.qcard:focus-visible{outline:2px solid var(--zinc);outline-offset:2px}
.shp{width:100%;max-width:140px;height:auto;margin-bottom:4px}
.anim{display:block;width:100%;height:auto;border-radius:4px}
.animwrap{overflow-x:auto}
.caption{font-size:14.5px;line-height:1.5;margin-top:8px;max-width:70ch}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.hcard{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2);min-width:0}
.hcard.warn{border-left-color:var(--warn)} .hcard.crit{border-left-color:var(--crit)}
.hcard header{display:flex;align-items:center;gap:6px}
.hcard .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)} .hcard .dot.warn{background:var(--warn)} .hcard .dot.crit{background:var(--crit)}
.hbar{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center}
.hbar .track{grid-column:1/-1}
.hbar .warn{color:var(--warn)} .hbar .crit{color:var(--crit)}
.track{position:relative;height:7px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.track .zone{position:absolute;top:0;bottom:0;background:var(--ok-bg);border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.track .mk{position:absolute;top:-3px;width:4px;height:11px;margin-left:-2px;border-radius:2px;background:var(--ok)} .track .mk.warn{background:var(--warn)} .track .mk.crit{background:var(--crit)}
.track.big{height:16px;margin:6px 0}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:3px} .track .fill.ok{background:var(--ok)} .track .fill.crit{background:var(--crit)}
.track .line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.order{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--panel2)}
.order>div:first-child{min-width:0;flex:1}
.q{border:1px solid var(--warn);background:var(--warn-bg);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.boil{display:flex;align-items:center;gap:10px;margin-top:10px}
.boilbar{flex:1;height:14px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);overflow:hidden}
.boilbar i{display:block;height:100%;background:var(--zinc);transition:width .1s linear}
.boilbar.done{border-color:var(--ok)}
.swatch{width:46px;height:46px;border-radius:6px;border:1px solid var(--line);box-shadow:inset 0 0 12px rgba(255,255,255,.6)}
@media (prefers-reduced-motion:no-preference){.build .hit{animation:rise .6s ease-out both}.build .hit:nth-of-type(2){animation-delay:.2s}.build .hit:nth-of-type(3){animation-delay:.4s}.build .hit:nth-of-type(4){animation-delay:.6s}.build .hit:nth-of-type(5){animation-delay:.8s}.build .hit:nth-of-type(6){animation-delay:1s}.build .hit:nth-of-type(7){animation-delay:1.2s}.build .hit:nth-of-type(8){animation-delay:1.4s}.build .hit:nth-of-type(9){animation-delay:1.6s}.build .hit:nth-of-type(10){animation-delay:1.8s}.build .hit:nth-of-type(11){animation-delay:2s}.build .hit:nth-of-type(12){animation-delay:2.2s}.build .hit:nth-of-type(n+13){animation-delay:2.4s}@keyframes rise{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}}
